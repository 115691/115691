<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2048</title>
<style>
  :root {
    --bg: #faf8ef;
    --board-bg: #bbada0;
    --cell-empty: rgba(238, 228, 218, 0.35);
    --text-dark: #776e65;
    --text-light: #f9f6f2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    font-family: "Trebuchet MS", Verdana, Arial, sans-serif;
    color: var(--text-dark);
  }
  .wrap { width: 480px; max-width: 94vw; }
  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 16px;
  }
  h1 { font-size: 48px; margin: 0; color: var(--text-dark); }
  .scores { display: flex; gap: 8px; }
  .score-box {
    background: var(--board-bg);
    color: var(--text-light);
    border-radius: 6px;
    padding: 10px 18px;
    text-align: center;
    min-width: 70px;
  }
  .score-box .label { font-size: 12px; font-weight: bold; opacity: 0.8; }
  .score-box .value { font-size: 22px; font-weight: bold; }
  .controls-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .instructions { font-size: 14px; line-height: 1.4; max-width: 300px; }
  button#new-game {
    background: #8f7a66;
    color: var(--text-light);
    border: none;
    border-radius: 6px;
    padding: 10px 16px;
    font-weight: bold;
    font-size: 14px;
    cursor: pointer;
  }
  button#new-game:hover { background: #9f8a76; }
  .board-container {
    position: relative;
    background: var(--board-bg);
    border-radius: 8px;
    padding: 10px;
  }
  .grid-bg {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: 10px;
  }
  .cell-bg {
    aspect-ratio: 1 / 1;
    background: var(--cell-empty);
    border-radius: 4px;
  }
  .tile-layer {
    position: absolute;
    inset: 10px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: 10px;
    pointer-events: none;
  }
  .tile {
    position: absolute;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 4px;
    font-weight: bold;
    transition: top 0.1s ease-in-out, left 0.1s ease-in-out;
  }
  .tile-new { animation: appear 0.15s ease; }
  .tile-merged { animation: pop 0.15s ease; }
  @keyframes appear {
    0% { transform: scale(0); }
    100% { transform: scale(1); }
  }
  @keyframes pop {
    0% { transform: scale(1); }
    50% { transform: scale(1.15); }
    100% { transform: scale(1); }
  }
  .overlay {
    position: absolute;
    inset: 0;
    border-radius: 8px;
    background: rgba(238, 228, 218, 0.73);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    z-index: 10;
  }
  .overlay.show { display: flex; }
  .overlay .msg { font-size: 36px; font-weight: bold; color: var(--text-dark); }
  .overlay button {
    background: #8f7a66;
    color: var(--text-light);
    border: none;
    border-radius: 6px;
    padding: 10px 18px;
    font-weight: bold;
    cursor: pointer;
  }
  footer { margin-top: 16px; font-size: 13px; text-align: center; color: #776e65; opacity: 0.8; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>2048</h1>
    <div class="scores">
      <div class="score-box">
        <div class="label">SCORE</div>
        <div class="value" id="score">0</div>
      </div>
      <div class="score-box">
        <div class="label">BEST</div>
        <div class="value" id="best">0</div>
      </div>
    </div>
  </header>

  <div class="controls-row">
    <div class="instructions">Use arrow keys (or swipe) to move tiles. Combine matching numbers to reach <strong>2048</strong>!</div>
    <button id="new-game">New Game</button>
  </div>

  <div class="board-container" id="board-container">
    <div class="grid-bg" id="grid-bg"></div>
    <div class="tile-layer" id="tile-layer"></div>
    <div class="overlay" id="overlay">
      <div class="msg" id="overlay-msg">You win!</div>
      <button id="overlay-btn">Try Again</button>
    </div>
  </div>

  <footer>Reach 2048 to win — or keep going for a higher score.</footer>
</div>

<script>
(function () {
  const SIZE = 4;
  const boardContainer = document.getElementById('board-container');
  const gridBg = document.getElementById('grid-bg');
  const tileLayer = document.getElementById('tile-layer');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const overlayMsg = document.getElementById('overlay-msg');
  const overlayBtn = document.getElementById('overlay-btn');
  const newGameBtn = document.getElementById('new-game');

  let grid, score, best, won, over, keepPlaying;
  let tileId = 0;

  const tileColors = {
    2: ['#eee4da', '#776e65'], 4: ['#ede0c8', '#776e65'],
    8: ['#f2b179', '#f9f6f2'], 16: ['#f59563', '#f9f6f2'],
    32: ['#f67c5f', '#f9f6f2'], 64: ['#f65e3b', '#f9f6f2'],
    128: ['#edcf72', '#f9f6f2'], 256: ['#edcc61', '#f9f6f2'],
    512: ['#edc850', '#f9f6f2'], 1024: ['#edc53f', '#f9f6f2'],
    2048: ['#edc22e', '#f9f6f2']
  };

  for (let i = 0; i < SIZE * SIZE; i++) {
    const c = document.createElement('div');
    c.className = 'cell-bg';
    gridBg.appendChild(c);
  }

  best = Number(localStorage.getItem('2048-best') || 0);
  bestEl.textContent = best;

  function emptyGrid() {
    return Array.from({ length: SIZE }, () => Array(SIZE).fill(null));
  }

  function newGame() {
    grid = emptyGrid();
    score = 0;
    won = false;
    over = false;
    keepPlaying = false;
    overlay.classList.remove('show');
    scoreEl.textContent = 0;
    addRandomTile();
    addRandomTile();
    render([]);
  }

  function addRandomTile() {
    const empties = [];
    for (let r = 0; r < SIZE; r++)
      for (let c = 0; c < SIZE; c++)
        if (!grid[r][c]) empties.push([r, c]);
    if (empties.length === 0) return null;
    const [r, c] = empties[Math.floor(Math.random() * empties.length)];
    const value = Math.random() < 0.9 ? 2 : 4;
    const tile = { id: ++tileId, value, row: r, col: c, isNew: true };
    grid[r][c] = tile;
    return tile;
  }

  function cellSize() {
    const total = boardContainer.clientWidth - 20; // padding 10 each side
    const gap = 10;
    return (total - gap * (SIZE - 1)) / SIZE;
  }

  function render(mergedTiles) {
    tileLayer.innerHTML = '';
    const size = cellSize();
    const gap = 10;
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const t = grid[r][c];
        if (!t) continue;
        const el = document.createElement('div');
        el.className = 'tile';
        if (t.isNew) el.classList.add('tile-new');
        if (mergedTiles.includes(t.id)) el.classList.add('tile-merged');
        const [bg, fg] = tileColors[t.value] || ['#3c3a32', '#f9f6f2'];
        el.style.background = bg;
        el.style.color = fg;
        el.style.width = size + 'px';
        el.style.height = size + 'px';
        el.style.top = r * (size + gap) + 'px';
        el.style.left = c * (size + gap) + 'px';
        el.style.fontSize = (t.value > 999 ? size * 0.32 : size * 0.42) + 'px';
        el.textContent = t.value;
        tileLayer.appendChild(el);
        t.isNew = false;
      }
    }
    scoreEl.textContent = score;
    if (score > best) {
      best = score;
      bestEl.textContent = best;
      localStorage.setItem('2048-best', String(best));
    }
  }

  function traverse(dir, cb) {
    // dir: 'up' | 'down' | 'left' | 'right'
    const rowRange = [...Array(SIZE).keys()];
    const colRange = [...Array(SIZE).keys()];
    if (dir === 'down') rowRange.reverse();
    if (dir === 'right') colRange.reverse();
    for (const r of rowRange) for (const c of colRange) cb(r, c);
  }

  function vector(dir) {
    switch (dir) {
      case 'up': return { dr: -1, dc: 0 };
      case 'down': return { dr: 1, dc: 0 };
      case 'left': return { dr: 0, dc: -1 };
      case 'right': return { dr: 0, dc: 1 };
    }
  }

  function withinBounds(r, c) {
    return r >= 0 && r < SIZE && c >= 0 && c < SIZE;
  }

  function move(dir) {
    if (over && !keepPlaying) return;
    const { dr, dc } = vector(dir);
    let moved = false;
    const mergedIds = [];
    const mergedFlags = emptyGrid().map(row => row.map(() => false));

    traverse(dir, (r, c) => {
      const tile = grid[r][c];
      if (!tile) return;
      let newR = r, newC = c;
      while (true) {
        const nr = newR + dr, nc = newC + dc;
        if (!withinBounds(nr, nc)) break;
        const next = grid[nr][nc];
        if (!next) {
          newR = nr; newC = nc;
          continue;
        }
        if (next.value === tile.value && !mergedFlags[nr][nc] && next.id !== tile.id) {
          newR = nr; newC = nc;
        }
        break;
      }

      if (newR === r && newC === c) return;

      const target = grid[newR][newC];
      grid[r][c] = null;
      if (target && target.value === tile.value) {
        target.value *= 2;
        mergedFlags[newR][newC] = true;
        mergedIds.push(target.id);
        score += target.value;
        if (target.value === 2048 && !won) won = true;
      } else {
        tile.row = newR; tile.col = newC;
        grid[newR][newC] = tile;
      }
      moved = true;
    });

    if (!moved) return;

    const newTile = addRandomTile();
    render(mergedIds);

    if (won && !keepPlaying) {
      showOverlay('You win!', 'Keep Going');
      overlayBtn.onclick = () => { keepPlaying = true; overlay.classList.remove('show'); };
    } else if (isGameOver()) {
      over = true;
      showOverlay('Game Over', 'Try Again');
      overlayBtn.onclick = newGame;
    }
  }

  function isGameOver() {
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        if (!grid[r][c]) return false;
        const v = grid[r][c].value;
        if (c + 1 < SIZE && grid[r][c + 1] && grid[r][c + 1].value === v) return false;
        if (r + 1 < SIZE && grid[r + 1][c] && grid[r + 1][c].value === v) return false;
      }
    }
    return true;
  }

  function showOverlay(msg, btnText) {
    overlayMsg.textContent = msg;
    overlayBtn.textContent = btnText;
    overlay.classList.add('show');
  }

  const keyMap = {
    ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
    w: 'up', s: 'down', a: 'left', d: 'right'
  };
  window.addEventListener('keydown', (e) => {
    const dir = keyMap[e.key];
    if (!dir) return;
    e.preventDefault();
    move(dir);
  });

  // touch swipe support
  let touchStartX = 0, touchStartY = 0;
  boardContainer.addEventListener('touchstart', (e) => {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }, { passive: true });
  boardContainer.addEventListener('touchend', (e) => {
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
    if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 'right' : 'left');
    else move(dy > 0 ? 'down' : 'up');
  }, { passive: true });

  newGameBtn.addEventListener('click', newGame);
  window.addEventListener('resize', () => render([]));

  newGame();
})();
</script>
</body>
</html>
